[workspace]
members  = ["crates/nbformat", "crates/nbhtml", "crates/nbconv"]
resolver = "2"

[workspace.package]
edition    = "2021"
license    = "MIT"
repository = "https://github.com/ashleywalsh/nbconv-rs"

[profile.release]
lto           = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
