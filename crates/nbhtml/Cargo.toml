[package]
name = "nbhtml"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Transform parsed Jupyter notebooks into typed HTML document structures"

[lints]
workspace = true

[features]
# Emit `tracing` spans for profiling. Off by default; enabled via nbconv's
# `profiling` feature.
profiling = ["dep:tracing"]

[dependencies]
nbformat = { path = "../nbformat" }
maud = "0.26"
pulldown-cmark = "0.13"
syntect = "5"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
nbformat = { path = "../nbformat" }
