[package]
name = "nbformat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Strongly-typed Jupyter notebook (nbformat v4) deserialisation"

[lints]
workspace = true

[features]
# Emit `tracing` spans for profiling. Off by default; enabled via nbconv's
# `profiling` feature.
profiling = ["dep:tracing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
tracing = { version = "0.1", optional = true }
