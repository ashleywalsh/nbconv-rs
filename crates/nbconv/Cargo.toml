[package]
name = "nbconv"
version = "0.1.0"
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish     = false
description = "Convert Jupyter notebooks to HTML"

[[bin]]
name = "nbconv"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nbformat = { path = "../nbformat" }
nbhtml   = { path = "../nbhtml" }
clap = { version = "4", features = ["derive"] }
